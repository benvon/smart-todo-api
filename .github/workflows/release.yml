name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-rc*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa:
    uses: ./.github/workflows/quality.yml

  release:
    needs: qa
    if: needs.qa.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      pull-requests: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set release staging directory
        run: echo "RELEASE_QA_DIR=$RUNNER_TEMP/release-qa" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.qa.outputs.qa-artifact-name }}
          path: ${{ env.RELEASE_QA_DIR }}
      - name: Verify tested revision and prepare image instructions
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]
          test "$(jq -r .source_revision "$RELEASE_QA_DIR/qa.json")" = "$(git rev-parse HEAD)"
          test "$(jq -r .result "$RELEASE_QA_DIR/qa.json")" = success
          cp "$RELEASE_QA_DIR/contract.json" release/contract.json
          # Keep transient evidence outside the checkout; GoReleaser requires a clean tree.
          test -z "$(git status --porcelain)"
          # A failed draft requires operator resolution before retrying.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; resolve the existing publication before retrying.' >&2
            exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish draft artifacts after mandatory QA
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve exact registry manifest digests and package handoff
        run: |
          set -euo pipefail
          VERSION=${RELEASE_TAG#v}
          SERVER="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smart-todo-api-server:$VERSION"
          WORKER="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smart-todo-api-worker:$VERSION"
          SERVER_DIGEST=$(docker buildx imagetools inspect "$SERVER" --format '{{json .Manifest}}' | jq -er .digest)
          WORKER_DIGEST=$(docker buildx imagetools inspect "$WORKER" --format '{{json .Manifest}}' | jq -er .digest)
          SERVER_REF="${SERVER%:*}@$SERVER_DIGEST"
          WORKER_REF="${WORKER%:*}@$WORKER_DIGEST"
          docker pull "$SERVER_REF"
          docker pull "$WORKER_REF"
          for image in "$SERVER_REF" "$WORKER_REF"; do
            test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$(git rev-parse HEAD)"
          done
          # Inspect the exact image without executing it or providing credentials.
          CONTAINER=$(docker create "$SERVER_REF")
          trap 'docker rm "$CONTAINER" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/image-instructions"
          docker cp "$CONTAINER:/app/release" "$RUNNER_TEMP/image-instructions/release"
          docker cp "$CONTAINER:/app/migrations" "$RUNNER_TEMP/image-instructions/migrations"
          python3 scripts/ci_release.py verify-image --root "$RUNNER_TEMP/image-instructions" --contract "$RELEASE_QA_DIR/contract.json"
          git diff --exit-code -- go.mod go.sum
          jq -n --arg server "$SERVER" --arg worker "$WORKER" --arg sd "$SERVER_DIGEST" --arg wd "$WORKER_DIGEST" \
            '{api:{tag:$server,digest:$sd},worker:{tag:$worker,digest:$wd}}' > "$RELEASE_QA_DIR/images.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$(git rev-parse HEAD)/pulls" --jq '[.[] | {number, url:.html_url}]' > "$RELEASE_QA_DIR/prs.json"
          python3 scripts/ci_release.py package --contract "$RELEASE_QA_DIR/contract.json" --evidence "$RELEASE_QA_DIR/qa.json" \
            --images "$RELEASE_QA_DIR/images.json" --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" \
            --prs "$RELEASE_QA_DIR/prs.json" --output dist/release-handoff
      - name: Attest release instructions and artifact bindings
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/release-handoff.tar.gz
      - name: Attach complete handoff and publish release
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/release-handoff.tar.gz dist/release-handoff.tar.gz.sha256
          gh release view "$RELEASE_TAG" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'

          ## GitOps handoff
          Download `release-handoff.tar.gz` and its SHA-256 file. Verify its GitHub artifact attestation before use.
          `handoff/manifest.json` identifies API/worker digests, migration checksums, schema versions,
          bounded database commands, application PRs and exact-revision mandatory QA evidence.
          Execute migration → database validation → rolling deployment. Stop on failure for operator resolution/roll-forward.
          NOTES
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false
