repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key
      - id: name-tests-test
      - id: requirements-txt-fixer

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-vet
      - id: go-unit-tests
      - id: go-build
      - id: go-mod-tidy

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3
        types: [python]

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        types: [python]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        types: [python]

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.12.12
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.35.0
    hooks:
      - id: eslint
        files: ^web/.*\.js$
        types: [file]
        additional_dependencies:
          - eslint@^9.35.0
          - '@eslint/js@^9.35.0'
        args: ['--fix']

  - repo: local
    hooks:
      - id: go-imports
        name: goimports (Go-managed)
        entry: go tool -modfile=tools/quality/go.mod goimports -w
        language: system
        types: [go]
      - id: golangci-lint
        name: golangci-lint (Go-managed)
        entry: make lint
        language: system
        types: [go]
        pass_filenames: false
      - id: npm-package-lock
        name: Check package-lock.json is up to date
        entry: bash -c 'cd web && npm ci --dry-run'
        language: system
        files: ^web/package\.json$
        pass_filenames: false
